name: CI — build & test check

# A-03: This workflow used to DEPLOY to GitHub Pages on every push to main.
# That produced a second, broken copy of the app (GitHub Pages has no
# Cloudflare Functions/D1, so sign-in and the API were dead there) and it
# confused diagnosis. Production deploys ONLY go to Cloudflare Pages
# (fasrep.com) via `npm run deploy`. This workflow is now check-only.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build with Vite (Single-File) + assertions
        run: npm run build

      - name: Run test suite
        run: npm test
