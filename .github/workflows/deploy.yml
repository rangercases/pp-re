name: CI — build, test & deploy to Cloudflare Pages

# History (A-03): this workflow used to DEPLOY to GitHub Pages on every push
# to main. That produced a second, broken copy of the app (GitHub Pages has
# no Cloudflare Functions/D1, so sign-in and the API were dead there) and it
# confused diagnosis. It was then made check-only, with production deploys
# run manually via `npm run deploy`.
#
# Current setup (2026-11-06, owner decision): the check job still gates
# everything, and a deploy job now ships to Cloudflare Pages (fasrep.com)
# with `npm run deploy` whenever main is pushed (or on manual dispatch),
# using the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets.
# NEVER re-add a GitHub Pages deploy here — production is Cloudflare only.
#
# Security hardening (2026-11-14, post wfx-loot audit): third-party actions
# are pinned to full commit SHAs (tags are mutable and can be re-pointed),
# and checkout does not persist the GITHUB_TOKEN in the local git config,
# so code that runs later in the job cannot reuse it. Dependabot
# (.github/dependabot.yml) proposes the bumps for these pins as PRs.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build with Vite (Single-File) + assertions
        run: npm run build

      - name: Run test suite
        run: npm test

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Deploy (build + Wrangler Pages deploy)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
